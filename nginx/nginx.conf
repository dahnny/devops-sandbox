events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            return 200 "DevOps Sandbox Platform is running\n";
        }

        include /etc/nginx/conf.d/*.conf;
    }
}